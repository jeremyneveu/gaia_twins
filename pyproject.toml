[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-synth-spectra"
version = "0.1.0"
description = "Generate synthetic stellar spectra from Gaia IDs using AMBRE models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jeremy Neveu", email = "jeremy.neveu@example.com"}
]
keywords = ["astronomy", "gaia", "spectra", "stellar-atmospheres", "ambre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "gaiaxpy>=2.0.0",
    "tqdm>=4.60.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0",
    "flake8>=4.0",
]
docs = [
    "sphinx>=4.0",
]
plots = [
    "matplotlib>=3.5.0",
]

[project.scripts]
gaia-synth = "gaia_synth_spectra.cli.main:main"

[project.urls]
Homepage = "https://github.com/sylvielsstfr/gaia-synth-spectra"
Repository = "https://github.com/sylvielsstfr/gaia-synth-spectra"
Documentation = "https://github.com/sylvielsstfr/gaia-synth-spectra/blob/main/README.md"

[tool.setuptools]
packages = ["gaia_synth_spectra", "gaia_synth_spectra.src", "gaia_synth_spectra.utils", "gaia_synth_spectra.cli", "gaia_synth_spectra.data"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]

# Coverage configuration
[tool.coverage.run]
source = ["gaia_synth_spectra"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2

# Black configuration
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[project.urls]
Homepage = "https://github.com/sylvielsstfr/gaia-synth-spectra"
Documentation = "https://gaia-synth-spectra.readthedocs.io"
Repository = "https://github.com/sylvielsstfr/gaia-synth-spectra"
Issues = "https://github.com/sylvielsstfr/gaia-synth-spectra/issues"

[project.scripts]
gaia-synth = "gaia_synth_spectra.cli.main:main"

[tool.setuptools]
packages = ["gaia_synth_spectra"]

[tool.setuptools.dynamic]
version = {attr = "gaia_synth_spectra.__version__.__version__"}

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=gaia_synth_spectra --cov-report=html --cov-report=term"
