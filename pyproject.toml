[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-twins"
version = "0.1.0"
description = "Generate high-resolution synthetic stellar spectra ('twins') from Gaia source IDs using AMBRE stellar atmosphere models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jérémy Neveu", email = "jeremy.neveu@universite-paris-saclay.fr"}
]
keywords = ["astronomy", "gaia", "spectra", "stellar-atmospheres", "ambre", "twins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "gaiaxpy>=2.0.0",
    "tqdm>=4.60.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0",
    "flake8>=4.0",
]
docs = [
    "sphinx>=4.0",
]
plots = [
    "matplotlib>=3.5.0",
]

[project.scripts]
gaia-twins = "gaia_twins.cli.main:main"

[project.urls]
Homepage = "https://github.com/jeremyneveu/gaia-twins"
Repository = "https://github.com/jeremyneveu/gaia-twins"
Documentation = "https://github.com/jeremyneveu/gaia-twins/blob/main/README.md"
Issues = "https://github.com/jeremyneveu/gaia-twins/issues"

[tool.setuptools]
packages = [
    "gaia_twins",
    "gaia_twins.src",
    "gaia_twins.utils",
    "gaia_twins.cli",
    "gaia_twins.data",
]

[tool.setuptools.dynamic]
version = {attr = "gaia_twins.__version__.__version__"}

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=gaia_twins --cov-report=term"

# Coverage configuration
[tool.coverage.run]
source = ["gaia_twins"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
